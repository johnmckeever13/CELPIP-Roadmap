<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paragon Roadmap — Dev</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><header><div class="brand"><img src="celpip-logo.png" alt="CELPIP" class="logo"><div><small>LANGUAGE PORTFOLIO</small><h1>Paragon Roadmap <span class="devBadge">DEV — DO NOT DEPLOY</span></h1></div></div><div class="actions"><button type="button" id="themeToggle" title="Toggle dark mode">☾</button><button class="primary" id="add" disabled>+ Add project</button></div></header><main><section class="devBar" id="devBar"><span id="devStatus">Checking for a linked file…</span><button type="button" id="devLink" hidden>Link existing file</button><button type="button" id="devCreate" hidden>Create new file</button><button type="button" id="devReconnect" hidden>Reconnect</button><button type="button" id="devRelink" hidden>Change file</button></section><section class="toolbar"><input id="search" placeholder="Search projects"><select id="categoryFilter"></select><select id="statusFilter"></select><button id="clear">Clear filters</button></section><section id="metrics" class="metricsRow"></section><section class="panel"><div class="panelHead"><h2>Timeline</h2><span id="count"></span></div><div id="timeline"></div></section><section class="panel" id="parkingPanel"><div class="panelHead"><h2>Parking Lot</h2><div class="panelTools"><span id="parkingCount"></span><button type="button" id="addIdea" disabled>+ Add idea</button></div></div><div id="parking"></div></section></main><dialog id="dialog"><form id="form"><div class="dialogHead"><h2 id="dialogTitle">Project</h2><button type="button" id="close">×</button></div><input id="id" type="hidden"><div class="grid"><label class="wide">Project name<input id="name" required></label><label>Category<select id="pCategory" required></select></label><label>Owner<input id="owner" required></label><label>Status<select id="pStatus"></select></label><label>Priority<select id="priority"></select></label><label>% Complete<input id="percent" type="number" min="0" max="100" step="5" value="0"></label><label>Start month<input id="start" type="month" required></label><label>End month<input id="end" type="month" required></label><label class="wide">Jira link<input id="jira" type="url" placeholder="https://paragontesting.atlassian.net/browse/PT-1234"></label><label class="wide">Prototype link (optional)<input id="prototypeUrl" type="url" placeholder="https://..."></label><label class="wide">Notes<textarea id="objective" rows="3"></textarea></label></div><p id="error"></p><div class="dialogActions"><button type="button" class="danger" id="delete">Delete</button><span></span><button type="button" id="cancel">Cancel</button><button class="primary" type="submit">Save</button></div></form></dialog><dialog id="ideaDialog"><form id="ideaForm"><div class="dialogHead"><h2>Parking Lot idea</h2><button type="button" id="ideaClose">×</button></div><input id="ideaId" type="hidden"><div class="grid"><label class="wide">Idea<input id="ideaName" required></label><label class="wide">Category (optional)<select id="ideaCategory"></select></label><label class="wide">Jira link<input id="ideaJira" type="url" placeholder="https://paragontesting.atlassian.net/browse/PT-1234"></label><label class="wide">Notes<textarea id="ideaNotes" rows="4"></textarea></label></div><div class="dialogActions"><button type="button" class="danger" id="ideaDelete">Delete</button><span></span><button type="button" id="ideaCancel">Cancel</button><button class="primary" type="submit">Save</button></div></form></dialog><script src="admin.js"></script></body></html>
