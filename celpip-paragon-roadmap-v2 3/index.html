<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CELPIP & Paragon Roadmap</title><link rel="stylesheet" href="styles.css"></head><body><header><div><small>LANGUAGE PORTFOLIO</small><h1>CELPIP &amp; Paragon Roadmap</h1></div><div class="actions"><button id="export">Export JSON</button><label for="import">Import JSON</label><input id="import" type="file" accept=".json" hidden><button class="primary" id="add">+ Add project</button></div></header><main><section class="toolbar"><input id="search" placeholder="Search projects"><select id="portfolio"></select><select id="statusFilter"></select><button id="clear">Clear filters</button></section><section id="metrics" class="metrics"></section><section class="panel"><div class="panelHead"><div><small>FISCAL YEAR STARTS OCTOBER 1</small><h2>Portfolio timeline</h2></div><span id="count"></span></div><div id="timeline"></div></section></main><dialog id="dialog"><form id="form"><div class="dialogHead"><h2 id="dialogTitle">Project</h2><button type="button" id="close">×</button></div><input id="id" type="hidden"><div class="grid"><label class="wide">Project name<input id="name" required></label><label>Portfolio<input id="pPortfolio" required></label><label>Category<input id="category" required></label><label>Owner<input id="owner" required></label><label>Status<select id="pStatus"></select></label><label>Priority<select id="priority"></select></label><label>Start month<input id="start" type="month" required></label><label>End month<input id="end" type="month" required></label><label class="wide">Outcome<textarea id="objective" rows="3"></textarea></label></div><p id="error"></p><div class="dialogActions"><button type="button" class="danger" id="delete">Delete</button><span></span><button type="button" id="cancel">Cancel</button><button class="primary" type="submit">Save</button></div></form></dialog><script src="app.js"></script></body></html>
